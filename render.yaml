services:
  - type: web
    name: trustid-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: standard
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://sih2026-idea-presentation.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: AI_PROVIDER
        value: GEMINI_VISION_HYBRID
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render Dashboard Environment Secrets
      - key: VERIFICATION_MODE
        value: SANDBOX_GATEWAY
      - key: DATABASE_URL
        fromDatabase:
          name: trustid-postgres
          property: connectionString

databases:
  - name: trustid-postgres
    plan: free
    region: singapore
    databaseName: trustid_db
    user: trustid_user
